stages:
  - lint
  - build
  # - backend
  # - frontend

variables:
  AWS_BRANCH: $CI_COMMIT_BRANCH # Use current GitLab branch dynamically
  AWS_REGION: ap-northeast-1 # Aws Region
  AWS_APP_ID: d27kbx2628eq4q # Amplify App ID d392h4ccc80hkj
  S3_BUCKET_NAME: amplify-vtg-deploy-gitlab # S3 bucket for artifacts

frontend:lint:
  stage: lint
  image: node:20
  before_script:
    # Install npm dependencies
    - npm install --cache .npm --prefer-offline --force
  script:
    # Lint the React sources with the CRA (react-app) ESLint config from package.json
    - npx eslint src --ext .js,.jsx
  allow_failure: true # Warnings must not block the pipeline yet
  cache:
    paths:
      - .npm/**/*

frontend:build:
  stage: build
  image: node:20
  before_script:
    # Install aws-cli (Debian-based)
    - apt-get update
    - apt-get install -y awscli
    # Configure AWS
    - aws configure set region $AWS_REGION
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region $AWS_REGION
    # Install npm dependencies
    - npm install --cache .npm --prefer-offline --force
    # amplify_outputs.json is git-ignored but imported by src/index.js, so it has to be
    # generated from the Amplify app before building. It only exists for branches whose
    # backend has already been deployed, so fall back to a placeholder to keep this job
    # a pure compile check (the artifact is then NOT deployable)
    - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID || echo '{"version":"1.2","custom":{"API":{}}}' > amplify_outputs.json
    - mkdir -p src/
    - cp ./amplify_outputs.json ./src/
  script:
    # Build React app
    - npm run build
  cache:
    paths:
      - .npm/**/*
  artifacts:
    paths:
      - build/
    expire_in: 1 hour


version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install # Use the Node version pinned in .nvmrc
        - node -v
    build:
      commands:
        - npm ci --cache .npm --prefer-offline --force
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install # Use the Node version pinned in .nvmrc
        - node -v
        - npm install --force
        - cp ./amplify_outputs.json ./src/ # This will copy the file to src
    build:
      commands:
        - npm run build 
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
